name: Publish GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Content to publish
        required: true
        default: redirect
        type: choice
        options:
          - redirect
          - legacy-site

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci --include=dev --ignore-scripts
      - name: Test website and deployment helpers
        working-directory: site
        run: npm test
      - name: Build redirect
        if: inputs.mode == 'redirect'
        run: npm run build:redirect
      - name: Build legacy site
        if: inputs.mode == 'legacy-site'
        working-directory: site
        env:
          WAHLLM_BASE_PATH: /berlin-wahllm/
          WAHLLM_SITE_URL: https://bensk1.github.io/berlin-wahllm
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
